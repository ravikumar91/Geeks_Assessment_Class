    <script>
        function even_odd(num)
        {
            if(num%2==0){
                document.write(num+ " Is a even number");
            }else{
                document.write(num +" Is a odd number");
            }
        }


        function negative_positive_number(num)
        {
            if(num>0){
                document.write(num+ " Is a positive number");
            }else{
                document.write(num +" Is a negative number");
            }
        }

        function check_leapyear(year){
            if((year % 4 == 0 && year % 100 != 0) || (year % 400 == 0)){
                document.write(year + " Is a leap year");
            }else{
                document.write(year + " Is not a leap year");
            }
        }

        function fibonacci_series(term){
            let a=0;
            let b=1;
            let c=0;
            let sum=0;
            document.write(a);
            document.write(" "+b);
            for(let i=0;i<term-2;i++){
                c=a+b;
                document.write(" "+c);
                a=b;
                b=c;
            }
        } 

        function vowel_consonant(ch){

            if(ch=='a' || ch=='e' || ch=='i' || ch=='o' || ch=='u'){
                document.write(ch+" Is a Vowel")
            }else{
                document.write(ch+" Is a consonant")
            }
        }

        function palindrome_number(num){
            let rem = 0;
            let rev = 0;
            let tmp = num;
            while(num!=0){
                rem = num%10;
                rev = (rev*10)+rem;
                num = Math.floor(num / 10);
            }
            if(rev == tmp){
                document.write(tmp+" Is a palindrome number");
            }else{
                document.write(tmp+" Is not a palindrome number");

            }
        }

        function calculator(ch,n1,n2){
            switch(ch){
                case '+':
                    {
                        document.write("Sum of "+n1+ " and "+n2+ " is = "+(n1+n2));
                        break;
                    }
                case '-':
                    {
                        document.write("Subtraction of "+n1+ " and "+n2+ " is = "+(n1-n2));
                        break;
                    }
                case '*':
                    {
                        document.write("Multiplication of "+n1+ " and "+n2+ " is = "+(n1*n2));
                        break;
                    }
                case '/':
                    {
                        document.write("Division of "+n1+ " and "+n2+ " is = "+(Math.floor(n1/n2)));
                        break;
                    }        
                default:
                    document.write("Please eneter valid choice");
            }
        }

        {

            }else{
