<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rothko Painting</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 500px;
            height: auto;
            background-color: rgb(151, 98, 98);
            margin: auto;
            padding: 15px;
            border: 2px solid #534f58;
        }
        .section_1{
            width: 470px;
            height: 190px;
            background-image: linear-gradient(to right, #1e9263, #33aa5e, #54c153, #7bd73e, #a8eb12);
        }
        .section_2{
            width: 470px;
            height: 190px;
            margin-top: 15px;
            background: linear-gradient(90deg,rgba(131, 58, 180, 1) 0%, rgba(253, 29, 29, 1) 50%, rgba(252, 176, 69, 1) 100%);        
        }
        .section_3{
            width: 470px;
            height: 190px;
            margin-top: 15px;

            background: radial-gradient(circle,rgba(238, 174, 202, 1) 0%, rgba(170, 184, 79, 1) 18%, rgba(196, 180, 217, 1) 47%, rgba(148, 187, 233, 1) 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section_1"></div>
        <div class="section_2"></div>
        <div class="section_3"></div>
    </div>
</body>
</html>
